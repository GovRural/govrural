services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: govrural-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-govrural}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-govrural}
      POSTGRES_DB: ${POSTGRES_DB:-govrural}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - govrural_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-govrural}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: govrural-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - govrural_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  govrural_postgres_data:
  govrural_redis_data:
